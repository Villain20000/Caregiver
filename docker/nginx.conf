# ─────────────────────────────────────────────────────────────
# nginx.conf — Production server config for the Angular SPA
#
# Serves the static Angular build and proxies API + Socket.io
# requests to the NestJS API gateway container (`api` hostname
# resolves via Docker's internal DNS on the caregiver-net network).
# ─────────────────────────────────────────────────────────────

server {
  listen 80;
  server_name _;

  # Root directory where Angular's build output is served from.
  root /usr/share/nginx/html;
  index index.html;

  # SPA fallback — Angular router handles all client-side routes.
  # Any path that doesn't match a static file falls back to index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Proxy /api/* to the NestJS API gateway container.
  # The `api` hostname resolves via Docker's internal DNS.
  location /api/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Proxy Socket.io WebSocket connections to the API gateway.
  # Requires HTTP/1.1 + Upgrade headers for WebSocket handshake.
  location /socket.io/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
  }

  # Long-cache static assets (JS, CSS, fonts, images).
  # Angular CLI appends content hashes to filenames, so these
  # are safe to cache aggressively (1 year).
  location ~* \.(?:js|css|woff2?|svg|png|jpg|jpeg|gif|ico)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
