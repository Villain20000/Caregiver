# ─────────────────────────────────────────────────────────────
# Caregiver Healthcare Intelligence Platform — local dev stack
#
# Multi-container Docker Compose orchestration for the full platform:
#   - Data plane:  PostgreSQL 16 + pgvector
#   - Events:      Zookeeper + Apache Kafka
#   - Vector store: ChromaDB (for RAG embeddings)
#   - LLM:         Ollama (Llama-3-8B, local inference)
#   - App plane:   API gateway + 4 microservices + Angular web (nginx)
#
# Usage:
#   docker compose -f docker/docker-compose.yml up -d      # start all
#   docker compose -f docker/docker-compose.yml down        # stop all
#   docker compose -f docker/docker-compose.yml logs -f     # tail logs
#
# The `x-node-base` anchor defines shared settings inherited by all
# Node.js-based services (restart policy, env file, network).
# ─────────────────────────────────────────────────────────────

name: caregiver

# Shared defaults for all Node.js application containers.
x-node-base: &node-base
  restart: unless-stopped
  env_file:
    - ../.env
  networks:
    - caregiver-net

services:
  # ════════════════════════════════════════════════════════════
  # DATA PLANE
  # ════════════════════════════════════════════════════════════

  # PostgreSQL 16 with pgvector extension for hybrid vector search.
  # Shared by apps/api and services that need direct DB access
  # (fhir-ingestion, audit). Drizzle ORM connects via DATABASE_URL.
  postgres:
    <<: *node-base
    image: pgvector/pgvector:pg16
    container_name: caregiver-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-caregiver}
      POSTGRES_USER: ${POSTGRES_USER:-caregiver}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-caregiver_dev}
    ports:
      - '5432:5432'
    volumes:
      # Persist data across container restarts.
      - postgres-data:/var/lib/postgresql/data
      # Init script enables pgvector + pgcrypto extensions on first boot.
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-caregiver}']
      interval: 10s
      timeout: 5s
      retries: 5

  # ════════════════════════════════════════════════════════════
  # EVENT STREAMING PLANE
  # ════════════════════════════════════════════════════════════

  # Zookeeper — Kafka's coordination service (required by cp-kafka).
  # Can be replaced with KRaft mode in a future iteration for a
  # Zookeeper-less deployment.
  zookeeper:
    <<: *node-base
    image: confluentinc/cp-zookeeper:7.6.2
    container_name: caregiver-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  # Apache Kafka — the event bus for all inter-service communication.
  # Listens on two ports:
  #   - 29092 (internal, for other containers)
  #   - 9092  (host, for local dev from the host machine)
  kafka:
    <<: *node-base
    image: confluentinc/cp-kafka:7.6.2
    container_name: caregiver-kafka
    depends_on:
      zookeeper:
        condition: service_started
    ports:
      - '9092:9092'
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # Dual listener: internal (PLAINTEXT) + host (PLAINTEXT_HOST).
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      # Single-broker dev setup — production would use 3+ replicas.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      # Auto-create topics for dev convenience (disable in production).
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      # Speed up consumer group rebalancing for dev.
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ['CMD', 'kafka-topics', '--bootstrap-server', 'localhost:9092', '--list']
      interval: 15s
      timeout: 10s
      retries: 10

  # ════════════════════════════════════════════════════════════
  # AI / RAG PLANE
  # ════════════════════════════════════════════════════════════

  # ChromaDB — vector database for RAG embedding storage and retrieval.
  # Used exclusively by services/ai-rag. Stores embedded FHIR resources
  # for semantic similarity search during diagnosis generation.
  chroma:
    <<: *node-base
    image: chromadb/chroma:0.5.20
    container_name: caregiver-chroma
    ports:
      - '8000:8000'
    volumes:
      # Persist vector embeddings across container restarts.
      - chroma-data:/chroma/chroma
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8000/api/v1/heartbeat']
      interval: 10s
      timeout: 5s
      retries: 5

  # Ollama — local LLM server running Llama-3-8B.
  # The ai-rag microservice sends prompts here for inference.
  # Model must be pulled after first boot:
  #   docker exec caregiver-ollama ollama pull llama3:8b
  #   docker exec caregiver-ollama ollama pull nomic-embed-text
  # Reserves 4GB RAM for model loading. Adjust based on available memory.
  ollama:
    <<: *node-base
    image: ollama/ollama:0.3.13
    container_name: caregiver-ollama
    ports:
      - '11434:11434'
    volumes:
      # Persist downloaded models (~5GB for Llama-3-8B) across restarts.
      - ollama-data:/root/.ollama
    deploy:
      resources:
        reservations:
          memory: 4G
    healthcheck:
      test: ['CMD', 'ollama', 'list']
      interval: 30s
      timeout: 10s
      retries: 5

  # ════════════════════════════════════════════════════════════
  # APPLICATION PLANE
  # ════════════════════════════════════════════════════════════

  # API Gateway — NestJS on Fastify. The BFF for the Angular frontend.
  # Handles auth, RBAC, REST, Socket.io, and Kafka event production.
  api:
    <<: *node-base
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: caregiver-api
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - '3000:3000'
    command: npm run start --workspace @caregiver/api

  # FHIR Ingestion Microservice — validates and persists FHIR R4 bundles.
  fhir-ingestion:
    <<: *node-base
    build:
      context: ..
      dockerfile: docker/Dockerfile.service
    container_name: caregiver-fhir-ingestion
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - '4001:4001'
    command: npm run start --workspace @caregiver/fhir-ingestion

  # AI RAG Microservice — LangChain + ChromaDB + Ollama diagnosis pipeline.
  ai-rag:
    <<: *node-base
    build:
      context: ..
      dockerfile: docker/Dockerfile.service
    container_name: caregiver-ai-rag
    depends_on:
      chroma:
        condition: service_healthy
      ollama:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - '4002:4002'
    command: npm run start --workspace @caregiver/ai-rag

  # Notifications Microservice — real-time alert fan-out via Socket.io.
  notifications:
    <<: *node-base
    build:
      context: ..
      dockerfile: docker/Dockerfile.service
    container_name: caregiver-notifications
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - '4003:4003'
    command: npm run start --workspace @caregiver/notifications

  # Audit Microservice — append-only audit log consumer.
  audit:
    <<: *node-base
    build:
      context: ..
      dockerfile: docker/Dockerfile.service
    container_name: caregiver-audit
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - '4004:4004'
    command: npm run start --workspace @caregiver/audit

  # Web — Angular SPA served by nginx in production mode.
  # nginx proxies /api and /socket.io to the API gateway container.
  web:
    <<: *node-base
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    container_name: caregiver-web
    depends_on:
      api:
        condition: service_started
    ports:
      - '4200:80'

# ══════════════════════════════════════════════════════════════
# NETWORKS & VOLUMES
# ══════════════════════════════════════════════════════════════

networks:
  caregiver-net:
    driver: bridge

volumes:
  postgres-data: # PostgreSQL data files + pgvector indexes
  chroma-data: # ChromaDB vector embeddings
  ollama-data: # Ollama downloaded models (Llama-3-8B, nomic-embed-text)
